<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重量转换器 - InterConverter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    .interconverter-embed {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      max-width: 400px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }
    
    .interconverter-embed-header {
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .interconverter-embed-header svg {
      width: 24px;
      height: 24px;
    }
    
    .interconverter-embed-header h3 {
      font-size: 16px;
      font-weight: 600;
    }
    
    .interconverter-embed-body {
      padding: 20px;
    }
    
    .interconverter-embed-input-group {
      margin-bottom: 16px;
    }
    
    .interconverter-embed-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    
    .interconverter-embed-input {
      width: 100%;
      padding: 10px 14px;
      font-size: 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    .interconverter-embed-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    .interconverter-embed-result {
      background: #f3f4f6;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    
    .interconverter-embed-result-value {
      font-size: 24px;
      font-weight: 700;
      color: #3b82f6;
      margin-bottom: 4px;
    }
    
    .interconverter-embed-result-unit {
      font-size: 14px;
      color: #6b7280;
    }
    
    .interconverter-embed-footer {
      padding: 12px 20px;
      background: #f9fafb;
      border-top: 1px solid #e5e7eb;
      text-align: center;
    }
    
    .interconverter-embed-footer a {
      font-size: 12px;
      color: #6b7280;
      text-decoration: none;
    }
    
    .interconverter-embed-footer a:hover {
      color: #3b82f6;
    }
  </style>
</head>
<body>
  <!-- 重量转换器小工具 -->
  <div class="interconverter-embed" id="interconverter-weight-converter">
    <div class="interconverter-embed-header">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 6v6l4 2"/>
      </svg>
      <h3>重量转换器</h3>
    </div>
    <div class="interconverter-embed-body">
      <div class="interconverter-embed-input-group">
        <label class="interconverter-embed-label" for="pounds">磅 (lbs)</label>
        <input type="number" id="pounds" class="interconverter-embed-input" placeholder="输入磅数" oninput="convertWeight('lbs')">
      </div>
      <div class="interconverter-embed-result">
        <div class="interconverter-embed-result-value" id="kg-result">0.00</div>
        <div class="interconverter-embed-result-unit">千克 (kg)</div>
      </div>
    </div>
    <div class="interconverter-embed-footer">
      <a href="https://interconverter.com/unit/weight-converter" target="_blank">由 InterConverter 提供</a>
    </div>
  </div>

  <script>
    function convertWeight(type) {
      const poundsInput = document.getElementById('pounds');
      const kgResult = document.getElementById('kg-result');
      
      let pounds;
      if (type === 'lbs') {
        pounds = parseFloat(poundsInput.value) || 0;
      }
      
      const kg = pounds * 0.45359237;
      kgResult.textContent = kg.toFixed(2);
    }
  </script>
</body>
</html>
